services:
  backend:
    # Utilisation de l'image publiée sur Docker Hub
    image: arijbelaid/garderie-backend:latest
    container_name: garderie-backend
    ports:
      - "5000:5000"
    networks:
      - garderie-network
    restart: unless-stopped

  frontend:
    # Utilisation de l'image publiée sur Docker Hub
    image: arijbelaid/garderie-frontend:latest
    container_name: garderie-frontend
    ports:
      - "3000:3000"
    depends_on:
      - backend
    networks:
      - garderie-network
    restart: unless-stopped

networks:
  garderie-network:
    driver: bridge
