services:
  backend:
    build: ./backend
    container_name: garderie-backend
    ports:
      - "5000:5000"
    networks:
      - garderie-network
    restart: unless-stopped

  frontend:
    build: ./frontend
    container_name: garderie-frontend
    ports:
      - "3000:3000"
    depends_on:
      - backend
    networks:
      - garderie-network
    restart: unless-stopped

networks:
  garderie-network:
    driver: bridge
