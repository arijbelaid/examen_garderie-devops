---
# 1. Installer les prérequis pour ajouter un dépôt APT
- name: Installer les paquets prérequis
  apt:
    name:
      - apt-transport-https
      - ca-certificates
      - curl
      - gnupg
    state: present
    update_cache: yes

# 2. Ajouter la clé GPG officielle de Docker
- name: Ajouter la clé GPG de Docker
  apt_key:
    url: https://download.docker.com/linux/ubuntu/gpg
    state: present

# 3. Ajouter le dépôt officiel Docker
- name: Ajouter le dépôt Docker
  apt_repository:
    repo: "deb [arch=amd64] https://download.docker.com/linux/ubuntu {{ ansible_distribution_release }} stable"
    state: present

# 4. Installer Docker Engine et le plugin Docker Compose
- name: Installer Docker Engine et Docker Compose
  apt:
    name:
      - docker-ce
      - docker-ce-cli
      - containerd.io
      - docker-compose-plugin
    state: present
    update_cache: yes

# 5. Démarrer et activer le service Docker
- name: Démarrer et activer le service Docker
  systemd:
    name: docker
    state: started
    enabled: yes

# 6. Autoriser l'utilisateur de déploiement à exécuter Docker
- name: Ajouter l'utilisateur au groupe docker
  user:
    name: "{{ ansible_user | default('arij') }}" 
    groups: docker
    append: yes
